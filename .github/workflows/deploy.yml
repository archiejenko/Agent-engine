name: Deploy

# Primary deploy path (runbook: docs/runbooks/deploy.md). Manual only: nothing deploys on push.
# Runs the full check first, then the same `pnpm cf:deploy` the laptop runs, then confirms the site
# is still behind Cloudflare Access.
on:
  workflow_dispatch:

# Never two deploys at once; a second run waits for the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID live on this GitHub environment, not the repo.
    environment:
      name: production
      url: https://engine.ejtech.co.uk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The same checks CI runs. A red check never deploys.
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build dashboard
        run: pnpm build:dashboard
      - name: Browser for the layout test
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests
        run: pnpm test

      # Bundles brain/, builds the dashboard, deploys the Worker, applies pending D1 migrations.
      - name: Deploy to Cloudflare
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Fail closed: without logging in, the page must redirect to Access and /api must never answer.
      - name: Check the site is still behind Access
        run: |
          sleep 15
          # The Worker's own lock also blocks /api, so a non-200 alone doesn't prove Access is in front.
          # 1) The page, asked for like a browser, must redirect to the Cloudflare Access login.
          read -r code location < <(curl -s -o /dev/null -H 'Accept: text/html' -w '%{http_code} %{redirect_url}\n' https://engine.ejtech.co.uk/)
          echo "Unauthenticated / returned HTTP $code -> ${location:-no redirect}"
          case "$code $location" in
            30[1237]\ https://*.cloudflareaccess.com/*) ;;
            *)
              echo "::error::engine.ejtech.co.uk/ is not redirected to the Cloudflare Access login. Check the Access app 'engine' covers engine.ejtech.co.uk."
              exit 1
              ;;
          esac
          # 2) The API must never answer without a login. Access may redirect (default) or return 401
          #    (Managed OAuth / non-browser setting); the Worker's own lock returns 401/403.
          code=$(curl -s -o /dev/null -w '%{http_code}' https://engine.ejtech.co.uk/api/health)
          echo "Unauthenticated /api/health returned HTTP $code"
          case "$code" in
            30[1237]|401|403) ;;
            *)
              echo "::error::engine.ejtech.co.uk/api/health answered HTTP $code without a login. Expected a redirect, 401 or 403."
              exit 1
              ;;
          esac
