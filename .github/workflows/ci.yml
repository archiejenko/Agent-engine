name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build dashboard
        run: pnpm build:dashboard
      - name: Browser for the layout test (no sideways scroll on any page)
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests (includes building and running the real Worker bundle)
        run: pnpm test
